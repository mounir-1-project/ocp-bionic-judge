# -----------------------------------------------------------------------------
# PLAN DE MAINTENANCE PREVENTIVE
# Source : "5-Plan de Maintenance Preventive REFROIDISSEUR DE SECHAGE PSIII.xlsx"
# -----------------------------------------------------------------------------
plan_maintenance:
  A: { tache: "Mesure des épaisseurs de la calandre",              type: INSP, etat: "Arrêt process", periodicite: "4 ans" }
  B: { tache: "Mesure des épaisseurs des tubes par courant de Foucault", type: INSP, etat: "Arrêt process", periodicite: "2 ans" }
  C: { tache: "Inspection externe du refroidisseur",               type: INSP, etat: "En marche",     periodicite: "1 mois" }
  D: { tache: "Contrôle anode sacrificielle",                      type: INSP, etat: "Arrêt process", periodicite: "6 mois" }
  E: { tache: "Changement anode sacrificielle",                    type: SYS,  etat: "Arrêt process", periodicite: "3 ans", pdr: "Anode sacrificielle" }
  F: { tache: "Changement de la vanne d'acide de vidange",         type: SYS,  etat: "Arrêt process", periodicite: "4 ans", pdr: "Vanne DN 3'' classe 150" }
  G: { tache: "Changement des vannes de vidange eau de mer",       type: SYS,  etat: "Arrêt process", periodicite: "6 ans", pdr: "Vanne DN 3'' classe 150 (x2)" }
  H: { tache: "Changement refroidisseur ou tubes tamponnes >= 30%", type: SYS, etat: "Arrêt process", periodicite: "8 ans", pdr: "Refroidisseur de rechange" }

# -----------------------------------------------------------------------------
# GAMMES D'INTERVENTION (source : fichiers 7 et 8)
# Le Judge s'en sert pour verifier la FAISABILITE d'une action recommandee :
# une action exigeant un arret process ne peut pas etre prescrite "immediatement"
# sur une ligne en marche sans mention de la consignation.
# -----------------------------------------------------------------------------
gammes:
  PS3-ABS-REFR:
    intitule: "Demontage et remontage des PV / couvercles du refroidisseur d'acide PS III"
    duree_min: 295
    etat_requis: "Arrêt process + consignation"
    epi: ["Casque", "Lunettes", "Chaussures", "Gants", "Tenue anti-acide complete + ecran"]
    prerequis:
      - "Consigner le moteur de la pompe d'absorption"
      - "Isoler et consigner les circuits acide et eau de mer"
