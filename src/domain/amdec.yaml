    detection_actuelle: "Visuel"
    F: 2
    G: 8
    N: 7
    C: 112                      # criticite la plus elevee de l'AMDEC
    action_corrective: "Changement systématique"
    plan_maintenance_ref: ["D", "E"]
    signature:
