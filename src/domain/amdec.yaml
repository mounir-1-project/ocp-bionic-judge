# -----------------------------------------------------------------------------
# MODES AJOUTES — INSTRUMENTATION
# Absents de l'AMDEC mecanique de 2019, mais AVERES dans DATA.xlsx et
# indispensables : un diagnostic base sur un capteur mort est pire qu'aucun
# diagnostic. Cotation proposee selon les memes baremes, a valider par OCP.
# -----------------------------------------------------------------------------
  CAPTEUR_DEFAILLANT:
    provenance:
      category: application_rule
      source_file: "DATA.xlsx"
