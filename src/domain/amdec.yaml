      validation_owner: "Instrumentation et ingénieur fiabilité OCP"
    sous_equipement: INSTRUMENTATION
    element: "Chaîne de mesure (capteur / transmetteur / carte E/S)"
    fonction: "Fournir une mesure valide au systeme de conduite et de surveillance"
    mode: "Signal figé, saturé en butée, ou code qualité Bad / I/O Timeout"
    causes: ["Transmetteur HS", "Perte de communication E/S", "Depassement de capacite 16 bits", "Point en reconfiguration"]
