# =============================================================================
# BASE DE CONNAISSANCE AMDEC — REFROIDISSEUR E7301
# Transcription fidele de : "4-AMDEC - REFROIDISSEUR DE SECHAGE PSIII.xlsx"
# analyse du 23/09/2019, realisee par OUBID, atelier PS III.
#
# Criticite C = F (frequence) x G (gravite) x N (non-detection)
# Les baremes G / F / N sont ceux des onglets GRV / OCC / DET du fichier source.
#
# Ce fichier sépare la transcription OCP des règles dérivées de l'application :
#  - le detecteur y rattache chaque anomalie a un mode de defaillance
#  - le Judge y verifie que l'action recommandee correspond bien a l'action
#    corrective prevue par l'AMDEC et au plan de maintenance preventive
# =============================================================================

bareme_gravite:      # onglet GRV
  10: "Dangereux sans alarme — securite / non-respect reglementaire, SANS avertissement"
  9:  "Dangereux avec alarme — securite / non-respect reglementaire, AVEC avertissement"
  8:  "Tres eleve — arret > 8 h ou produit non conforme > 4 h"
  7:  "Eleve — arret 4 a 8 h ou produit non conforme 2 a 4 h"
  6:  "Modere — arret 1 a 4 h ou produit non conforme 1 a 2 h"
  5:  "Faible — arret 30 min a 1 h"
  4:  "Tres faible — arret 10 a 30 min, pas de produit non conforme"
  3:  "Mineur — arret jusqu'a 10 min"
  2:  "Tres mineur — parametres hors specification, ajustement en marche"
  1:  "Sans effet — ajustement en maintenance normale"

bareme_frequence:    # onglet OCC — MTBF en heures
  10: { desc: "Defaillance chaque heure",   mtbf_h: 1 }
  9:  { desc: "Defaillance chaque poste",   mtbf_h: 8 }
  8:  { desc: "Defaillance chaque jour",    mtbf_h: 24 }
  7:  { desc: "Defaillance chaque semaine", mtbf_h: 80 }
  6:  { desc: "Defaillance chaque mois",    mtbf_h: 350 }
  5:  { desc: "Defaillance tous les 3 mois", mtbf_h: 1000 }
  4:  { desc: "Defaillance tous les 6 mois", mtbf_h: 2500 }
  3:  { desc: "Defaillance chaque annee",   mtbf_h: 5000 }
  2:  { desc: "Defaillance tous les 2 ans", mtbf_h: 10000 }
  1:  { desc: "Defaillance tous les 5 ans", mtbf_h: 25000 }

bareme_detection:    # onglet DET
  1:  "Tres eleve — la surveillance detecte quasi certainement"
  3:  "Eleve — surveillance ou controle visuel previennent la defaillance critique"
  5:  "Modere — necessite un outillage specifique, la surveillance ne detecte pas"
  7:  "Faible — necessite un demontage, la surveillance ne detecte pas"
  10: "Tres faible — aucune detection possible"

# -----------------------------------------------------------------------------
# MODES DE DEFAILLANCE
# `signature` = comment le mode se manifeste dans les donnees DCS.
# C'est ce qui relie l'AMDEC papier a la detection temps reel.
# -----------------------------------------------------------------------------
modes:

  FAISCEAU_BOUCHAGE:
    provenance:
      category: derived_rule
      source_file: "4-AMDEC - REFROIDISSEUR DE SECHAGE PSIII.xlsx"
      source_location: "Feuille AMDEC FOUR A SOUFRE, lignes 9-11"
      original_values: { element: "FAISEAU TUBULAIRE", mode: "Fuite / Bouchage", F: 3, G: 7, N: 5, C: 105 }
      transformations: ["Séparation du libellé source combiné Fuite / Bouchage pour le rattachement des règles."]
      validation_status: derived_documented
      validation_owner: "Ingénieur fiabilité OCP"
    sous_equipement: FOUR
    element: FAISCEAU TUBULAIRE
    fonction: "Assurer l'echange thermique entre l'acide et l'eau de mer"
    mode: "Bouchage / encrassement"
    causes: ["Depot de sulfates", "Debris dans les tubes", "Tubes tamponnes cumules"]
    effet: "Perte de capacité d'échange -> réduction de cadence puis arrêt de la ligne"
    detection_actuelle: "Visuel (inspection interne, revision)"
    F: 3
    G: 7
    N: 5
    C: 105
    action_corrective: "Mesure des épaisseurs (courant de Foucault) — nettoyage haute pression des tubes"
    plan_maintenance_ref: ["B", "H"]
    signature:
      description: >
        La temperature de sortie acide etant REGULEE, l'encrassement ne se voit
        pas directement sur TI1105 : la vanne d'eau de mer s'ouvre davantage et
        maintient la consigne. Il se lit sur le COEFFICIENT D'ECHANGE GLOBAL UA,
        calcule par la methode efficacite-NTU a partir de la climatologie d'eau
        de mer de Safi. Une baisse persistante de UA a debit, temperature et eau
        de mer donnes est la signature du depot. La perte de controle sur TI1105
        n'arrive qu'ensuite, quand la boucle froide a consomme toute sa marge :
        c'est la manifestation terminale, pas le signal precoce.
      indicators:
        - ua_residual_trend_14d    # derive du coefficient d'echange global
        - fouling_resistance       # Rf = 1/UA - 1/UA_attendu, en K/kW
        - control_deviation_high   # TI1105 hors bande : stade terminal
      horizon: "Degradation lente — semaines a mois"
      # Deficit de coefficient d'echange, en ecarts-types de la reference, au-dela
      # duquel la constatation passe d'INFO a WARNING.
      #
      # Une version precedente faisait dependre ce passage d'une corroboration
      # par l'effort de regulation, avec un seuil que cet indicateur n'atteint
      # jamais sur le corpus : la severite WARNING etait inatteignable. La
      # gradation porte desormais sur la grandeur diagnostique elle-meme.
      #
      # 3,0 sigma correspond, sur les references ajustees, a une perte de l'ordre
      # de 10 % du coefficient d'echange — le seuil a partir duquel le banc
      # d'injection montre que la detection reste exploitable. A reviser avec le
      # service fiabilite des qu'un evenement d'encrassement sera date.
      warning_sigma: 3.0

  FAISCEAU_FUITE:
    provenance:
      category: derived_rule
      source_file: "4-AMDEC - REFROIDISSEUR DE SECHAGE PSIII.xlsx"
      source_location: "Feuille AMDEC FOUR A SOUFRE, lignes 9-11"
      original_values: { element: "FAISEAU TUBULAIRE", mode: "Fuite / Bouchage", F: 3, G: 7, N: 5, C: 105 }
      transformations: ["Séparation du libellé source combiné Fuite / Bouchage pour le rattachement des règles."]
      validation_status: derived_documented
      validation_owner: "Ingénieur fiabilité OCP"
    sous_equipement: FOUR
    element: FAISCEAU TUBULAIRE
    fonction: "Assurer l'echange thermique entre l'acide et l'eau de mer"
    mode: "Fuite"
    causes: ["Usure", "Corrosion", "Perte d'epaisseur"]
    effet: "Arrêt de la ligne — mélange acide / eau de mer"
    detection_actuelle: "Visuel"
    F: 3
    G: 7
    N: 5
    C: 105
    action_corrective: "Mesure des épaisseurs (courant de Foucault) — tamponnage des tubes percés"
    plan_maintenance_ref: ["B", "H"]
    signature:
      description: >
        Une fuite tube envoie de l'eau de mer dans l'acide : le titre chute
        brutalement et durablement. C'est LE signal le plus critique du systeme.
        Une chute de titre non expliquee par une action operateur doit etre
        traitee comme une suspicion de fuite jusqu'a preuve du contraire.
      indicators:
        - concentration_drop_sustained
        - concentration_cross_check_divergence
      horizon: "Evenement rapide — heures"
      severite_immediate: CRITICAL

  FAISCEAU_CORROSION:
    provenance:
      category: derived_rule
      source_file: "4-AMDEC - REFROIDISSEUR DE SECHAGE PSIII.xlsx"
      source_location: "Feuille AMDEC FOUR A SOUFRE, lignes 9-11"
      original_values: { element: "FAISEAU TUBULAIRE", mode: "Fuite / Bouchage", cause: "Corrosion", F: 3, G: 7, N: 5, C: 105 }
      transformations: ["La cause source Corrosion est utilisée comme règle de risque distincte; ce n'est pas une ligne AMDEC OCP autonome."]
      validation_status: hypothesis
      validation_owner: "Ingénieur fiabilité OCP"
    sous_equipement: FOUR
    element: FAISCEAU TUBULAIRE
    fonction: "Assurer l'echange thermique entre l'acide et l'eau de mer"
    mode: "Corrosion / perte d'épaisseur"
    causes: ["Acide dilue", "Temperature excessive", "Protection anodique defaillante"]
    effet: "Amincissement des tubes -> fuite -> arrêt de la ligne"
    detection_actuelle: "Mesure d'epaisseur"
    F: 3
    G: 7
    N: 5
    C: 105
    action_corrective: "Mesure des épaisseurs (courant de Foucault)"
    plan_maintenance_ref: ["A", "B"]
    signature:
      description: >
        Conditions FAVORISANT la corrosion du 904L, et non la corrosion
        elle-meme (non mesurable en ligne) : titre acide sous specification
        et/ou temperature acide excessive. Le systeme compte le TEMPS D'EXPOSITION
        cumule a ces conditions — c'est un indicateur de duree de vie, pas une alarme.
      indicators:
        - concentration_below_spec
        - temperature_in_excessive
        - cumulative_corrosion_exposure_h
      horizon: "Degradation tres lente — mois a annees"
      # La signature ci-dessus le dit elle-meme : ce qui est surveille, ce sont
      # les CONDITIONS qui favorisent la corrosion, pas la corrosion.
      # L'amincissement des tubes ne se mesure que par courant de Foucault, a
      # l'arret. Faute d'avoir declare ce champ, le mode heritait de
      # `bool(indicators) = true` et etait compte comme pleinement couvert :
      # 105 points de criticite ajoutes a tort a la couverture publiee.
      #
      # `partial` est le degre exact : le systeme voit ce qui use le faisceau,
      # jamais son usure.
      observable: partial

