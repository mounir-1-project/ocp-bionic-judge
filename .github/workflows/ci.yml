name: OCP Bionic Judge — CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          # Configuration in pyproject.toml ([tool.ruff]) — single source of truth.
          ruff check src/ api/ data/

      - name: Security check dependencies
        run: |
          pip install pip-audit
          pip-audit --ignore-vuln PYSEC-2022-42974 || true

      - name: Run pytest with coverage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_SECRET_KEY: test-secret-key
          DATABASE_URL: sqlite:///data/ocp_bionic.db
          MLFLOW_TRACKING_URI: ./mlruns
          LOG_LEVEL: WARNING
        run: |
          pytest tests/ \
            -v \
            --cov=src \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=75 \
            -x

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: ocp-bionic-coverage

      - name: Check coverage badge
        run: |
          echo "Coverage report generated successfully"
          cat coverage.xml | grep -o 'line-rate="[^"]*"' | head -1
