name: Surveillance E7301 — CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  qualite:
    name: Qualite du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les outils qualite
        run: pip install ruff bandit mypy

      - name: Analyse statique
        run: |
          ruff check src api tests scripts
          bandit -q -r src api -x tests
          node --check api/static/app.js
          node --check api/static/twin.js

      # CI-1 — MYPY ETAIT CONFIGURE, INSTALLE, DOTE D'UNE CIBLE `make types`,
      # ET ABSENT DE LA CHAINE. Le seul endroit du depot qui le mentionnait
      # etait `make clean`, pour effacer un cache que rien ne produisait.
      #
      # Il est NON BLOQUANT, exactement comme le declare `make types`. Le
      # rendre bloquant sur une base non annotee produirait des centaines
      # d'erreurs et la seule reaction possible serait de le desactiver.
      # Visible et informatif vaut mieux qu'inerte et declare.
      - name: Typage statique (informatif)
        continue-on-error: true
        run: mypy src api

      # LES SEPT CONTROLES DE REFERENTIEL QUI VIVAIENT ICI ONT ETE RETIRES.
      #
      # Soixante lignes de Python etaient inserees dans ce YAML pour verifier
      # C = F x G x N, l'existence des taches preventives citees, la completude
      # des blocs `provenance`, la presence d'une preuve par tag, les deux bases
      # de determination minimum, et la coherence de la topologie.
      #
      # Les SEPT existaient deja en pytest :
      #   test_domain.py   : criticite_est_le_produit_fgn, taches_preventives_
      #                      referencees_existent, provenance_amdec_source_et_
      #                      enrichissements_separes, chaque_tag_declare_sur_
      #                      quoi_repose_son_sens, la_base_de_determination_est_
      #                      publiee
      #   test_topology.py : chaque_capteur_situe_existe_dans_le_registre,
      #                      chaque_piece_cite_des_modes_amdec_existants,
      #                      le_rattachement_des_codes_ne_cite_rien_d_inconnu
      #
      # Le code inline n'etait ni linte par ruff, ni type, ni couvert, ni
      # executable en local : il ne pouvait que diverger de son jumeau, et
      # personne ne l'aurait vu. Le job `tests` execute la suite complete.

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Suite de tests
        env:
          LOG_LEVEL: WARNING
        run: pytest tests/ -q --cov=src --cov=api --cov-fail-under=85

      - name: Evaluation du Judge
        # Le systeme ne peut pas etre fusionne si son dispositif de controle ne
        # detecte plus les fautes logicielles injectées. Ce test mesure la
        # robustesse du contrôleur, jamais la validité industrielle.
        if: always() && matrix.python == '3.11'
        env:
          LOG_LEVEL: WARNING
        run: |
          python - <<'PY'
          import sys
          from src.pipeline import E7301Pipeline
          from src.governance.judge_eval import JudgeEvaluator
          res = JudgeEvaluator(E7301Pipeline(use_llm=False)).run(n_cases=6)
          s = res.summary
          print(res.report())
          ok = (s["trap_detection_rate"] >= 0.85
                and s["false_positive_rate"] <= 0.20
                and s["separation"] >= 2.0)
          sys.exit(0 if ok else 1)
          PY

      - name: Validation temporelle et lignée du modèle
        if: matrix.python == '3.11'
        env:
          LOG_LEVEL: WARNING
        run: python scripts/validate_release.py

      - name: Publier les preuves de validation
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: e7301-validation-${{ github.sha }}
          path: |
            reports/model_validation.json
            models/e7301_detector.manifest.json
          if-no-files-found: error
          retention-days: 90

  frontend:
    name: Bancs du poste (jsdom)
    runs-on: ubuntu-latest
    # LES TROIS BANCS FRONTEND NE BLOQUAIENT RIEN.
    # `package.json` declare `npm test`, le Makefile declare `test-front`, et
    # l'integration continue n'appelait ni l'un ni l'autre : 84 verifications
    # existaient sans jamais s'opposer a une fusion. Le poste est la seule
    # surface que l'exploitant voit; c'est aussi celle qui cassait le plus
    # silencieusement, puisqu'une erreur de cablage ne leve aucune exception
    # cote Python.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install --no-audit --no-fund

      - name: Regenerer les fixtures depuis le service reel
        # Les bancs rejouent le VRAI app.js contre des reponses REELLES du
        # service. Regenerer les fixtures a chaque execution garantit qu'un
        # champ renomme cote API fait echouer le banc, au lieu de le laisser
        # passer contre une capture perimee.
        env:
          LOG_LEVEL: WARNING
        run: python scripts/dump_fixtures.py

      - name: Cablage du poste, scene 3D et ecran de demarrage
        run: |
          node scripts/frontend_smoke.mjs
          node scripts/twin_smoke.mjs
          node scripts/boot_smoke.mjs

  image:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: [qualite, tests, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t ocp/e7301-surveillance:ci .

      - name: Verifier que le service demarre et repond
        run: |
          docker run -d --name e7301_ci -p 8000:8000 \
            -v "${{ github.workspace }}/data/raw:/app/data/raw:ro" \
            ocp/e7301-surveillance:ci
          for i in $(seq 1 30); do
            # LA SONDE PORTE SUR LA DISPONIBILITE, PAS SUR LA PROMOTION DU MODELE.
            # `/api/health` renvoie `degraded` tant qu'aucun modele n'est promu,
            # ce qui est l'etat nominal voulu : exiger "ok" rendait ce controle
            # impossible a satisfaire. `/api/health/ready` repond 200 ou 503.
            if curl -fsS http://localhost:8000/api/health/ready >/dev/null; then
              echo "Service operationnel apres ${i}0 s"; exit 0
            fi
            sleep 10
          done
          echo "Le service n'a pas demarre :"; docker logs e7301_ci; exit 1

      - name: Journaux du conteneur
        if: always()
        run: docker logs e7301_ci || true
